<form [formGroup] = 'product' (ngSubmit)="onSubmit()" >
    <!-- <div class="mb-3">
        <label for="id" class="form-label">Product ID</label>
        <input type="text" id="id" class="form-control" formControlName="id">
    </div> -->
    <div class="mb-3">
        <label for="name" class="form-label">Product Name</label>
        <input type="text" id="name" class="form-control" formControlName="name">
    </div>
    <div class="mb-3">
        <label for="category" class="form-label">Product Category</label>
        <input type="text" id="category" class="form-control" formControlName="category">
    </div>
    <div class="mb-3">
        <label for="price" class="form-label">Product Price</label>
        <input type="text" id="price" class="form-control" formControlName="price">
    </div>
    <div class="mb-3">
        <label for="quantity" class="form-label">Product Quantity</label>
        <input type="text" id="quantity" class="form-control" formControlName="quantity">
    </div>
    <button type="submit">Submit</button>
</form>
<router-outlet></router-outlet>
