<form (ngSubmit)="updateProduct()">
    <label>Name</label>
    <input type="text" [(ngModel)]="product.name" name="name">
    
    <label>Category</label>
    <input type="text" [(ngModel)]="product.category" name="category">

    <label>Price</label>
    <input type="text" [(ngModel)]="product.price" name="price">

    <label>Quantity</label>
    <input type="text" [(ngModel)]="product.quantity" name="quantity">

    <button type="submit">Update Product</button>
</form>  
<router-outlet></router-outlet>
