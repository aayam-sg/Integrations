<div class="bg-primary text-white p-5 rounded-4 shadow mb-4">

    <h3 class="display-5 fw-bold">
        Product Management System
    </h3>    
</div>
<div class="container mx-4">
     <table *ngIf = "products && products.length > 0; ">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>  
            <th>Price</th>
            <th>Quantity</th>   
        </tr>
        <tr *ngFor = "let product of products">
            <td>{{product.id}}</td>
            <td>{{product.name}}</td> 
            <td>{{product.category}}</td>
            <td>{{product.price}}</td>
            <td>{{product.quantity}}</td>
            <button type="button" (click)="onClickUpdate(product)">Update</button> 
            <button type="button" (click)="onClickDelete(product.id)">Delete</button>
            <!-- <td>{{product | json}}</td> -->
        </tr>
    </table> 
</div>
<div class="mb-3">
    <button (click)="addProduct()"> Add Product</button>
</div>
<router-outlet></router-outlet>
