<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <h2 class="fw-bold mb-1">Add Person</h2>
          <p class="text-muted mb-0">Enter the required details to save a new person record.</p>
        </div>

        <form [formGroup]="person" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              type="text"
              id="name"
              class="form-control form-control-lg"
              formControlName="name"
              placeholder="Enter full name"
            >
            <div *ngIf="person.get('name')?.invalid && person.get('name')?.touched" class="text-danger small mt-1">
              Name is required.
            </div>
          </div>

          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input
              type="number"
              id="age"
              class="form-control form-control-lg"
              formControlName="age"
              placeholder="Enter age"
            >
            <div *ngIf="person.get('age')?.invalid && person.get('age')?.touched" class="text-danger small mt-1">
              Age is required.
            </div>
          </div>

          <div class="mb-4">
            <label for="gender" class="form-label">Gender</label>
            <input
              type="text"
              id="gender"
              class="form-control form-control-lg"
              formControlName="gender"
              placeholder="Enter gender"
            >
            <div *ngIf="person.get('gender')?.invalid && person.get('gender')?.touched" class="text-danger small mt-1">
              Gender is required.
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="person.invalid">
            Save Person
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
