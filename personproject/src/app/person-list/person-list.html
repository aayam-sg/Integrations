<div class="card shadow border-0 rounded-4">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Person List</h2>
        <p class="text-muted mb-0">View all people and manage records.</p>
      </div>
      <a routerLink="/person" class="btn btn-primary">
        + Add Person
      </a>
    </div>

    <div class="table-responsive">
      <table *ngIf="persons && persons.length > 0; else noData" class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let person of persons">
            <td>{{ person.pid }}</td>
            <td>{{ person.name }}</td>
            <td>{{ person.age }}</td>
            <td>{{ person.gender }}</td>
            <td class="text-center">
              <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-outline-primary btn-sm" (click)="onClickUpdate(person)">
                  Update
                </button>
                <button class="btn btn-outline-danger btn-sm" (click)="onClickDelete(person.pid)">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <ng-template #noData>
        <div class="alert alert-info mb-0">
          No persons found. Please add a new person.
        </div>
      </ng-template>
    </div>
  </div>
</div>
